<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Vento Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="d-flex" id="wrapper">

    <div id="sidebar-container"></div>

    <!-- CONTENIDO -->
    <div id="page-content-wrapper">
        <div id="navbar-container"></div>

        <div class="container-fluid px-5 pt-2">
            <div class="mb-4 text-white">
                <h2 class="fw-bold">Reportes</h2>
                <p class="text-white-50">Resumen estadístico de tu negocio</p>
            </div>

            <!-- Cards de métricas dinámicas -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="glass-card-light text-center">
                        <i class="bi bi-calendar-check fs-1 icon-gold mb-2 d-block"></i>
                        <h3 class="text-white fw-bold" id="reporteTotalMes">0</h3>
                        <p class="text-white-50 mb-0">Eventos este mes</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card-light text-center">
                        <i class="bi bi-currency-dollar fs-1 icon-purple mb-2 d-block"></i>
                        <h3 class="text-white fw-bold" id="reporteIngresos">$0</h3>
                        <p class="text-white-50 mb-0">Ingresos estimados</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card-light text-center">
                        <i class="bi bi-people fs-1 icon-gold mb-2 d-block"></i>
                        <h3 class="text-white fw-bold" id="reporteClientes">0</h3>
                        <p class="text-white-50 mb-0">Total de eventos</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="glass-card-light text-center">
                        <i class="bi bi-star fs-1 icon-purple mb-2 d-block"></i>
                        <h3 class="text-white fw-bold" id="reporteCalif">4.8</h3>
                        <p class="text-white-50 mb-0">Calificación promedio</p>
                    </div>
                </div>
            </div>

            <!-- Tabla dinámica -->
            <div class="glass-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="text-white fw-semibold mb-0">Reporte Detallado por Tipo de Evento</h5>
                    <button class="btn btn-gold btn-sm px-4"onclick="exportarCSV()">
                        <i class="bi bi-download me-2"></i>Exportar
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table custom-table text-white align-middle">
                        <thead>
                            <tr>
                                <th>Tipo de Evento</th>
                                <th>Cantidad</th>
                                <th>Ingresos</th>
                                <th>Promedio por Evento</th>
                                <th>% del Total</th>
                            </tr>
                        </thead>
                        <tbody id="tablaReportes">
                            <tr>
                                <td colspan="5" class="text-white-50 text-center">
                                    Cargando datos...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Toast de alertas -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="alertaToast" class="toast align-items-center border-0" style="display:none;">
        <div class="d-flex">
            <div class="toast-body" id="alertaMsg"></div>
            <button type="button" class="btn-close me-2 m-auto" onclick="ocultarAlerta()"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
